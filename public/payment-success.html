<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>支付成功 - 汽车租赁系统</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB',
                'Microsoft YaHei', 'Helvetica Neue', Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 60px 40px;
            max-width: 500px;
            width: 100%;
            text-align: center;
            animation: slideUp 0.5s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .icon-wrapper {
            width: 120px;
            height: 120px;
            margin: 0 auto 30px;
            position: relative;
            animation: scaleIn 0.5s ease-out 0.2s both;
        }

        @keyframes scaleIn {
            from {
                opacity: 0;
                transform: scale(0);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .success-checkmark {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            display: block;
            stroke-width: 3;
            stroke: #4CAF50;
            stroke-miterlimit: 10;
            box-shadow: inset 0 0 0 #4CAF50;
            animation: fillGreen 0.4s ease-in-out 0.4s forwards, scaleCircle 0.3s ease-in-out 0.9s both;
        }

        @keyframes scaleCircle {
            0%, 100% {
                transform: none;
            }
            50% {
                transform: scale(1.1);
            }
        }

        @keyframes fillGreen {
            100% {
                box-shadow: inset 0 0 0 60px #4CAF50;
            }
        }

        .success-checkmark__circle {
            stroke-dasharray: 377;
            stroke-dashoffset: 377;
            stroke-width: 3;
            stroke-miterlimit: 10;
            stroke: #4CAF50;
            fill: none;
            animation: strokeCircle 0.6s cubic-bezier(0.65, 0, 0.45, 1) forwards;
        }

        @keyframes strokeCircle {
            100% {
                stroke-dashoffset: 0;
            }
        }

        .success-checkmark__check {
            transform-origin: 50% 50%;
            stroke-dasharray: 60;
            stroke-dashoffset: 60;
            stroke: #fff;
            stroke-width: 4;
            animation: strokeCheck 0.3s cubic-bezier(0.65, 0, 0.45, 1) 0.8s forwards;
        }

        @keyframes strokeCheck {
            100% {
                stroke-dashoffset: 0;
            }
        }

        h1 {
            color: #333;
            font-size: 36px;
            margin-bottom: 16px;
            font-weight: 600;
        }

        .success-message {
            color: #4CAF50;
            font-size: 20px;
            margin-bottom: 40px;
            font-weight: 500;
        }

        .tips {
            padding: 20px;
            background: #e8f5e9;
            border-radius: 12px;
            font-size: 15px;
            color: #2e7d32;
            line-height: 1.8;
            margin-bottom: 30px;
        }

        .button-group {
            display: flex;
            gap: 12px;
            margin-top: 30px;
        }

        .btn {
            flex: 1;
            padding: 14px 28px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: white;
            color: #667eea;
            border: 2px solid #667eea;
        }

        .btn-secondary:hover {
            background: #f0f2ff;
            transform: translateY(-2px);
        }

        @media (max-width: 576px) {
            .container {
                padding: 40px 24px;
            }

            h1 {
                font-size: 28px;
            }

            .success-message {
                font-size: 18px;
            }

            .button-group {
                flex-direction: column;
            }

            .btn {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon-wrapper">
            <svg class="success-checkmark" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 52 52">
                <circle class="success-checkmark__circle" cx="26" cy="26" r="25" fill="none"/>
                <path class="success-checkmark__check" fill="none" d="M14.1 27.2l7.1 7.2 16.7-16.8"/>
            </svg>
        </div>

        <h1>支付成功！</h1>
        <p class="success-message">您的订单已支付完成</p>

        <div class="tips">
            <strong>温馨提示</strong><br>
            订单信息已发送至您的邮箱和手机，请注意查收。<br>
            如有疑问，请联系客服。
        </div>

        <div class="button-group">
            <a href="/" class="btn btn-primary">返回首页</a>
            <a href="/my-orders" class="btn btn-secondary">查看订单</a>
        </div>
    </div>
</body>
</html>
