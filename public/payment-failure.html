<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>支付失败 - 汽车租赁系统</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB',
                'Microsoft YaHei', 'Helvetica Neue', Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 60px 40px;
            max-width: 500px;
            width: 100%;
            text-align: center;
            animation: slideUp 0.5s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .icon-wrapper {
            width: 120px;
            height: 120px;
            margin: 0 auto 30px;
            position: relative;
            animation: scaleIn 0.5s ease-out 0.2s both;
        }

        @keyframes scaleIn {
            from {
                opacity: 0;
                transform: scale(0);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .error-cross {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            display: block;
            stroke-width: 3;
            stroke: #f44336;
            stroke-miterlimit: 10;
            box-shadow: inset 0 0 0 #f44336;
            animation: fillRed 0.4s ease-in-out 0.4s forwards, scaleCircle 0.3s ease-in-out 0.9s both;
        }

        @keyframes scaleCircle {
            0%, 100% {
                transform: none;
            }
            50% {
                transform: scale(1.1);
            }
        }

        @keyframes fillRed {
            100% {
                box-shadow: inset 0 0 0 60px #f44336;
            }
        }

        .error-cross__circle {
            stroke-dasharray: 377;
            stroke-dashoffset: 377;
            stroke-width: 3;
            stroke-miterlimit: 10;
            stroke: #f44336;
            fill: none;
            animation: strokeCircle 0.6s cubic-bezier(0.65, 0, 0.45, 1) forwards;
        }

        @keyframes strokeCircle {
            100% {
                stroke-dashoffset: 0;
            }
        }

        .error-cross__line1,
        .error-cross__line2 {
            stroke-dasharray: 30;
            stroke-dashoffset: 30;
            stroke: #fff;
            stroke-width: 4;
            animation: strokeLine 0.3s cubic-bezier(0.65, 0, 0.45, 1) 0.8s forwards;
        }

        @keyframes strokeLine {
            100% {
                stroke-dashoffset: 0;
            }
        }

        h1 {
            color: #333;
            font-size: 36px;
            margin-bottom: 16px;
            font-weight: 600;
        }

        .error-message {
            color: #f44336;
            font-size: 20px;
            margin-bottom: 40px;
            font-weight: 500;
        }

        .reason-list {
            background: #fff3e0;
            border-radius: 12px;
            padding: 24px;
            margin: 20px 0 30px;
            text-align: left;
        }

        .reason-list-title {
            color: #e65100;
            font-weight: 600;
            font-size: 16px;
            margin-bottom: 12px;
        }

        .reason-list ul {
            list-style: none;
            padding: 0;
        }

        .reason-list li {
            color: #666;
            font-size: 15px;
            line-height: 2;
            padding-left: 20px;
            position: relative;
        }

        .reason-list li:before {
            content: "•";
            color: #ff9800;
            font-weight: bold;
            position: absolute;
            left: 6px;
        }

        .button-group {
            display: flex;
            gap: 12px;
            margin-top: 30px;
        }

        .btn {
            flex: 1;
            padding: 14px 28px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
        }

        .btn-primary {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(245, 87, 108, 0.4);
        }

        .btn-secondary {
            background: white;
            color: #f5576c;
            border: 2px solid #f5576c;
        }

        .btn-secondary:hover {
            background: #fff0f2;
            transform: translateY(-2px);
        }

        .support-link {
            margin-top: 24px;
            font-size: 15px;
            color: #666;
        }

        .support-link a {
            color: #f5576c;
            text-decoration: none;
            font-weight: 500;
        }

        .support-link a:hover {
            text-decoration: underline;
        }

        @media (max-width: 576px) {
            .container {
                padding: 40px 24px;
            }

            h1 {
                font-size: 28px;
            }

            .error-message {
                font-size: 18px;
            }

            .button-group {
                flex-direction: column;
            }

            .btn {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon-wrapper">
            <svg class="error-cross" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 52 52">
                <circle class="error-cross__circle" cx="26" cy="26" r="25" fill="none"/>
                <path class="error-cross__line1" fill="none" d="M16,16 l20,20" />
                <path class="error-cross__line2" fill="none" d="M36,16 l-20,20" />
            </svg>
        </div>

        <h1>支付失败</h1>
        <p class="error-message">很抱歉，您的支付未能完成</p>

        <div class="reason-list">
            <div class="reason-list-title">可能的原因：</div>
            <ul>
                <li>账户余额不足</li>
                <li>银行卡信息错误</li>
                <li>支付密码输入错误</li>
                <li>网络连接中断</li>
                <li>支付已超时</li>
                <li>银行系统维护中</li>
            </ul>
        </div>

        <div class="button-group">
            <a href="javascript:history.back()" class="btn btn-primary">重新支付</a>
            <a href="/" class="btn btn-secondary">返回首页</a>
        </div>

        <div class="support-link">
            遇到问题？<a href="/contact">联系客服</a>
        </div>
    </div>
</body>
</html>
